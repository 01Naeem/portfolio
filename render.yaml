# Render Blueprint: New > Blueprint > pick this repo. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: portfolio-api            # <- becomes https://portfolio-api.onrender.com ; use that URL in client/vercel.json
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: "22" }
      - { key: TRUST_PROXY, value: "2" }          # Vercel rewrite -> Render = 2 proxies. Verify: GET /api/health/ip
      - { key: JWT_EXPIRES_IN, value: 1d }
      - { key: MONGODB_URI, sync: false }          # MongoDB Atlas connection string
      - { key: JWT_SECRET, generateValue: true }   # Render generates a strong random value
      - { key: CLIENT_ORIGINS, sync: false }       # https://yourname.dev (your Vercel domain, no trailing slash)
      - { key: SITE_URL, sync: false }             # same as above
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: SMTP_FROM, sync: false }
      - { key: ADMIN_NOTIFY_EMAIL, sync: false }
      - { key: GITHUB_TOKEN, sync: false }         # optional
